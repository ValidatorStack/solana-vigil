name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build release assets
        run: make release VERSION="${GITHUB_REF_NAME}" COMMIT="${GITHUB_SHA}" DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Keylessly sign checksums
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob --output-signature dist/SHA256SUMS.sig --output-certificate dist/SHA256SUMS.pem dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
